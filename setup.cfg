
[flake8]
# Ignore D202: No blank lines allowed after function docstring
ignore = D202
# Set maximum line length to 120 characters
max-line-length = 120
# Enforce import order
application-import-names = your_package_name

[isort]
profile = black
known_first_party = project
sections = STDLIB,THIRDPARTY,FIRSTPARTY
no_lines_before = THIRDPARTY
lines_between_sections = 1
lines_between_types = 0
force_sort_within_sections = true
combine_as_imports = true
