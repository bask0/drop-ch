[project]
authors = [{name = "Basil Kraft", email = "29065166+bask0@users.noreply.github.com"}]
dependencies = []
description = "DROP: a neural network for modeling and routing streamflow over a river network (research code)."
license = "MIT"
license-files = ["LICENSE"]
name = "drop"
readme = "README.md"
requires-python = ">= 3.11"
version = "1.0.0"

[tool.hatch.build.targets.wheel]
packages = ["project"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["pyg", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]

# Core Python
python = "3.11.*"
numpy = "*"
scikit-learn = "*"
pandas = "*"
tqdm = "*"

# Geospatial
xarray = "*"
dask = "*"
netcdf4 = "*"
zarr = "*"
pyarrow = "*"
dbfread = "*"
richdem = "*"
geopandas = "*"
rioxarray = "*"
xarray-spatial = "*"
gdal = ">=3.12.1"
cdo = ">=2.5.0"
nco = ">=5.3.6"
timezonefinder = "*"

# I/O
ffmpeg = "*"
imagemagick = "*"
owslib = "*"

# Visualization
matplotlib = "*"
seaborn = "*"
cartopy = "*"
plotly = "*"

# Jupyter / Notebook
jupyterlab = "*"
ipywidgets = "*"
IProgress = "*"
dask-labextension = "*"
nodejs = "*"

# ML / DL & Experiment Tracking
setuptools = "<71"
optuna = "*"
optuna-integration = "*"
tensorboard = "*"
omegaconf = "*"
einops = "*"

# Development / Profiling / QA
ruff = "*"
ty = "*"
line_profiler = "*"
memory_profiler = "*"
nbstripout = "*"
pre-commit = "*"
pytest = "*"

[tool.pixi.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu126" }
torch_geometric = {}
torch_sparse = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu126/torch_sparse-0.6.18%2Bpt28cu126-cp311-cp311-linux_x86_64.whl" }
torch_scatter = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu126/torch_scatter-2.1.2%2Bpt28cu126-cp311-cp311-linux_x86_64.whl" }
lightning = {}
exactextract = {}
jsonargparse = { version = ">=4.18.0", extras = ["signatures"] }
kaleido = "*"

# Local packages
drop = { path = ".", editable = true }

[tool.pixi.activation.env]
# Ignore packages installed with `pip install --user` (~/.local), which would otherwise shadow the environment's.
PYTHONNOUSERSITE = "1"

[tool.pixi.tasks]
export-environment = { description = "Export the current environment to environment.yaml", cmd = "pixi workspace export conda-environment > environment.yaml" }
hooks-install = "pre-commit install"
hooks-run     = "pre-commit run --all-files"
setup         = { depends-on = ["hooks-install"], cmd = "echo pre-commit enabled" }

[tool.ty.environment]
python = ".pixi/envs/default"

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "NPY",  # NumPy-specific rules
    "RUF",  # Ruff-specific rules
]
ignore = [
    "N803",    # Argument name should be lowercase: matrices/physical quantities (A, Q, T) keep their math names.
    "N806",    # Variable in function should be lowercase: same as above.
    "D104",    # Missing docstring in public package: the __init__.py files are empty.
    "D105",    # Missing docstring in magic method.
    "D107",    # Missing docstring in __init__: documented on the class instead.
    "D202",    # No blank lines allowed after function docstring: house style is one blank line.
    "RET504",  # Unnecessary assignment before return: named results read better.
    "SIM108",  # Use ternary operator: explicit if/else is often clearer.
    "C408",    # Unnecessary dict() call: dict(key=...) is used deliberately for keyword-style mappings.
    "RUF001",  # Ambiguous unicode character in string: units such as m³ and °C are intended.
    "RUF002",  # Ambiguous unicode character in docstring: same as above.
    "RUF003",  # Ambiguous unicode character in comment: same as above.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]
# Loss modules keep torch.nn's `forward(input, target)` signature.
"project/utils/torch/loss.py" = ["A002"]
