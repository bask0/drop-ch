model:
  class_path: project.nn.runoff_net.RunoffNet
  init_args:
    hidden_size: 64
    lstm_layers: 1
    variational_dropout: 0.0
    enc_dropout: 0.0
    learning_rate: 0.001
    weight_decay: 0.01
    max_q_chunk_size: 200
    prediction_length: 20

data:
  class_path: project.data.datamodule.HRUDataModule
  init_args:
    data_path: "/cluster/work/climate/kraftb/data/machflow_routing/processed/harmonized_hru_data.zarr"
    stat_features:
      -  agriculture_freq
      -  area
      -  artificial_freq
      -  aspect_mean
      -  barren_freq
      -  bdod_mean
      -  cfvo_mean
      -  clay_mean
      -  forests_freq
      -  glaciers_freq
      -  height_mean
      -  is_lake
      -  sand_mean
      -  shrubs_freq
      -  silt_mean
      -  slope_mean
      -  water_freq
      -  wetlands_freq
    dyn_features:
      - prec
      - tair
    norm_targets: True
    temporal_context_length: 365
    prediction_length: 20
    batch_size: 256
    num_workers: 12

trainer:
  max_epochs: 120
  log_every_n_steps: 10
  gradient_clip_val: 1.0

tuning_engine:
  exp_dir: experiments/prevah
  log_dir: /cluster/work/climate/kraftb/streamflow_net/prevah
  monitor: valid_loss
  n_trials: 60
  num_folds: 1
  overwrite: False

  sampler:
    class_path: optuna.samplers.TPESampler
    init_args:
      n_startup_trials: 8
      multivariate: True
      constant_liar: True

  pruner:
    class_path: optuna.pruners.HyperbandPruner
    init_args:
      min_resource: 20
      max_resource: 120
      reduction_factor: 3

  search_space:
    model:
      learning_rate:
        method: float
        low: 1e-4
        high: 1e-2
        log: True

      weight_decay:
        method: float
        low: 1e-5
        high: 1e-1
        log: True

      variational_dropout:
        method: float
        low: 0.0
        high: 0.3

      enc_dropout:
        method: float
        low: 0.0
        high: 0.3

      hidden_size:
        method: int
        low: 128
        high: 384
        step: 128
