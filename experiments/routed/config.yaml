model:
  class_path: project.nn.streamflow_net.StreamflowNet
  init_args:
    runoff_net_exp_dir: ${log_root}/prevah
    runoff_use_pretrained: true
    runoff_lr: 0.0001
    runoff_weight_decay: 0.0
    runoff_lr_div_factor: 10.0
    runoff_lr_warmup_epochs: 5
    runoff_dropout: 0.1
    runoff_enc_dropout: 0.1
    evaporation_enabled: true
    evaporation_lr: 0.01
    routing_hidden_size: 64
    routing_time_substeps: 1
    routing_lr: 0.0001
    routing_weight_decay: 0.0

    lake_constraint_rate_constant: 0.01
    lake_constraint_strength: 8
    num_samples_per_graph: 50
    gradient_accumulation_steps: 1
    max_q_chunk_size: 50

data:
  class_path: project.data.datamodule.GraphDataModule
  init_args:
    data_path: "${data_root}/harmonized_hru_data.zarr"
    stat_features:
      -  agriculture_freq
      -  area
      -  artificial_freq
      -  aspect_mean
      -  barren_freq
      -  bdod_mean
      -  cfvo_mean
      -  clay_mean
      -  forests_freq
      -  glaciers_freq
      -  height_mean
      -  is_lake
      -  sand_mean
      -  shrubs_freq
      -  silt_mean
      -  slope_mean
      -  water_freq
      -  wetlands_freq
    stat_routing_features:
      -  area
      -  dam_height
      -  impoundment_volume
      -  is_barrage
      -  is_floodcontrol
      -  is_hydroelectricity
      -  is_lake
      -  is_other_aim
      -  is_regulated_lake
      -  is_storage_dam
      -  slope_mean
      -  upstream_area
      -  water_freq
    dyn_features:
      - prec
      - tair
    norm_targets: False
    split_mode: random
    aggregate_catchments: False
    k_hops: 200
    temporal_context_length: 365
    prediction_length: 20
    batch_size: 2
    num_workers: 8
    val_time_range: ["1990-01-01", "1999-12-31"]


trainer:
  max_epochs: 200
  reload_dataloaders_every_n_epochs: 1
  callbacks:
    class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 10

tuning_engine:
  exp_dir: experiments/routed
  log_dir: ${log_root}/routed
  monitor: valid_loss
  n_trials: 40
  num_folds: 1
  overwrite: False

  sampler:
    class_path: optuna.samplers.TPESampler
    init_args:
      n_startup_trials: 8
      multivariate: True
      constant_liar: True
      n_ei_candidates: 64

  pruner:
    class_path: optuna.pruners.HyperbandPruner
    init_args:
      min_resource: 50
      max_resource: 100
      reduction_factor: 2

  search_space:
    model:
      runoff_lr:
        method: float
        low: 1e-6
        high: 1e-4
        log: True

      runoff_weight_decay:
        method: float
        low: 1e-6
        high: 1e-2
        log: True

      evaporation_lr:
        method: float
        low: 1e-6
        high: 1e-4
        log: True

      routing_lr:
        method: float
        low: 1e-5
        high: 1e-3
        log: True

      routing_weight_decay:
        method: float
        low: 1e-6
        high: 1e-2
        log: True
