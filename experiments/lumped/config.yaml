model:
  class_path: project.nn.runoff_net.RunoffNet
  init_args:
    hidden_size: 32
    lstm_layers: 1
    dropout: 0.0
    enc_dropout: 0.0
    learning_rate: 0.001
    weight_decay: 0.01
    max_q_chunk_size: 20
    prediction_length: 20
    normalize_runoff: true

data:
  class_path: project.data.datamodule.GraphDataModule
  init_args:
    data_path: "/net/argon/landclim/kraftb/machflow_routing/data/processed/harmonized_hru_data.zarr"
    stat_features:
      -  agriculture_freq
      -  area
      -  artificial_freq
      -  aspect_mean
      -  barren_freq
      -  bdod_mean
      -  cfvo_mean
      -  clay_mean
      -  dam_height
      -  forests_freq
      -  glaciers_freq
      -  height_max
      -  height_mean
      -  height_min
      -  impoundment_level
      -  impoundment_volume
      -  is_barrage
      -  is_floodcontrol
      -  is_hydroelectricity
      -  is_lake
      -  is_other_aim
      -  is_regulated_lake
      -  is_storage_dam
      -  sand_mean
      -  shrubs_freq
      -  silt_mean
      -  slope_max
      -  slope_mean
      -  slope_min
      -  upstream_area
      -  water_freq
      -  wetlands_freq
    stat_routing_features:
      -  area
      -  dam_height
      -  height_max
      -  height_mean
      -  height_min
      -  impoundment_volume
      -  is_barrage
      -  is_floodcontrol
      -  is_hydroelectricity
      -  is_lake
      -  is_other_aim
      -  is_regulated_lake
      -  is_storage_dam
      -  slope_mean
      -  upstream_area
      -  water_freq
    dyn_features:
      - prec
      - tair
    split_mode: random
    aggregate_catchments: true
    k_hops: 200
    temporal_context_length: 365
    prediction_length: 20
    batch_size: 8
    num_workers: 4

trainer:
  max_epochs: 3

tuning_engine:
  exp_dir: experiments/lumped
  log_dir: logs/lumped
  monitor: val_loss
  n_trials: 2
  study_name: study
  num_folds: 1
  overwrite: False

  sampler:
    class_path: optuna.samplers.TPESampler
    init_args:
      n_startup_trials: 15
      seed: 1
      multivariate: True

  pruner:
    class_path: optuna.pruners.HyperbandPruner
    init_args:
      min_resource: 10
      reduction_factor: 3

  search_space:
    model:
      learning_rate:
        method: loguniform
        low: 1e-5
        high: 1e-1

      hidden_size:
        method: categorical
        dtype: int
        choices: [16, 32, 64]
