model:
  class_path: project.nn.runoff_net.RunoffNet
  init_args:
    hidden_size: 32
    lstm_layers: 1
    variational_dropout: 0.0
    enc_dropout: 0.0
    learning_rate: 0.001
    weight_decay: 0.01
    max_q_chunk_size: 20

data:
  class_path: project.data.datamodule.GraphDataModule
  init_args:
    data_path: "/net/argon/landclim/kraftb/machflow_routing/data/processed/harmonized_hru_data.zarr"
    stat_features:
      -  agriculture_freq
      -  area
      -  artificial_freq
      -  aspect_mean
      -  barren_freq
      -  bdod_mean
      -  cfvo_mean
      -  clay_mean
      -  dam_height
      -  forests_freq
      -  glaciers_freq
      -  height_max
      -  height_mean
      -  height_min
      -  impoundment_level
      -  impoundment_volume
      -  is_barrage
      -  is_floodcontrol
      -  is_hydroelectricity
      -  is_lake
      -  is_other_aim
      -  is_regulated_lake
      -  is_storage_dam
      -  sand_mean
      -  shrubs_freq
      -  silt_mean
      -  slope_mean
      -  upstream_area
      -  water_freq
      -  wetlands_freq
    stat_routing_features: null
    dyn_features:
      - prec
      - tair
    norm_targets: True
    split_mode: random
    aggregate_catchments: true
    k_hops: 200
    temporal_context_length: 365
    prediction_length: 50
    batch_size: 8
    num_workers: 12

trainer:
  max_epochs: 200

tuning_engine:
  exp_dir: experiments/lumped
  log_dir: /net/argon/landclim/kraftb/machflow_routing/logs/lumped
  monitor: valid_loss
  n_trials: 80
  num_folds: 1
  overwrite: False

  sampler:
    class_path: optuna.samplers.TPESampler
    init_args:
      n_startup_trials: 20
      seed: 1
      multivariate: True

  pruner:
    class_path: optuna.pruners.HyperbandPruner
    init_args:
      min_resource: 10
      max_resource: 120
      reduction_factor: 3

  search_space:
    model:
      learning_rate:
        method: float
        low: 1e-4
        high: 1e-2
        log: True

      weight_decay:
        method: float
        low: 1e-5
        high: 1e-1
        log: True

      variational_dropout:
        method: float
        low: 0.0
        high: 0.3

      enc_dropout:
        method: float
        low: 0.0
        high: 0.3

      hidden_size:
        method: int
        low: 128
        high: 384
        step: 128
