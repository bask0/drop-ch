# Git hooks run on every commit. Install once with `pixi run setup`; run on all files with `pixi run hooks-run`.
# Hook versions match the ones locked in pixi.lock.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
