name: streamflow-net
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.11

  # --- PyTorch (CUDA 12.4 via conda) ---
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4

  # --- PyTorch Geometric (explicit) ---
  - torch-geometric

  # --- Other deps ---
  - pytorch-sparse
  - lightning
  - numpy
  - scikit-learn
  - optuna
  - optuna-integration
  - pandas
  - xarray
  - dask
  - netcdf4
  - zarr
  - geopandas
  - pyreadr
  - richdem
  - matplotlib
  - seaborn
  - cartopy
  - plotly
  - contextily
  - jupyterlab
  - nodejs
  - pymysql
  - pvlib-python
  - imagemagick
  - owslib
  - pip
  - pip:
      - dask-labextension
      - tensorboard
      - tensorboard-plugin-profile
      - flake8
      - kaleido
      - jsonargparse[signatures]>=4.18.0
      - omegaconf
      - jupyterlab-optuna
      - einops
      - ipywidgets
      - IProgress
      - rioxarray
      - xarray-spatial
      - line_profiler
      - -e .[dev]
